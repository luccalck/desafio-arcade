<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><rect width="100%" height="100%" fill="#080f1a"/><g font-family="sans-serif" fill="#edf6ff"><text x="24" y="33" font-size="23">Estados da aprendizagem e navegação</text><rect x="25" y="70" width="170" height="70" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="38" y="97" font-size="15">Menu / campanha</text><text x="203" y="115" font-size="23">→</text><rect x="240" y="70" width="245" height="70" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="253" y="97" font-size="15">Aula → exemplo por passo</text><text x="495" y="115" font-size="23">→</text><rect x="530" y="70" width="245" height="70" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="543" y="97" font-size="15">Prática guiada / sem XP</text><rect x="25" y="205" width="170" height="80" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="38" y="232" font-size="15">Final / 700 XP</text><text x="38" y="257" font-size="12">Após os seis setores</text><text x="205" y="253" font-size="23">←</text><rect x="240" y="205" width="245" height="80" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="253" y="232" font-size="15">Resultado / cenários</text><text x="253" y="257" font-size="12">Falha → editar e testar</text><text x="496" y="253" font-size="23">←</text><rect x="530" y="205" width="245" height="80" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="543" y="232" font-size="15">Desafio independente</text><text x="543" y="257" font-size="12">Vitória → medalha / próxima</text><text x="643" y="177" font-size="23">↓</text><text x="24" y="346" font-size="15">Pausa → retomar, rever aula, reiniciar tentativa, opções ou campanha.</text><text x="24" y="391" font-size="14">Rever aula preserva programa; reset confirmado reinicia só a campanha nova.</text></g></svg>