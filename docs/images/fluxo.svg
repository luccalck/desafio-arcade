<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340"><rect width="100%" height="100%" fill="#f4f0e6"/><g font-family="sans-serif" fill="#192b2b"><text x="20" y="30" font-size="22">Fluxo do jogo</text><rect x="20" y="80" width="138" height="80" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="35" y="108" font-size="15">Menu</text><text x="160" y="130" font-size="18">→</text><rect x="168" y="80" width="138" height="80" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="183" y="108" font-size="15">Edição</text><text x="308" y="130" font-size="18">→</text><rect x="316" y="80" width="138" height="80" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="331" y="108" font-size="15">Execução / passo</text><text x="456" y="130" font-size="18">→</text><rect x="464" y="80" width="138" height="80" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="479" y="108" font-size="15">Fim da tentativa</text><text x="604" y="130" font-size="18">→</text><rect x="612" y="80" width="138" height="80" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="627" y="108" font-size="15">Fase / campanha</text><text x="20" y="225" font-size="17">Falha → editar e tentar novamente. Sucesso → próximo desafio.</text><text x="20" y="265" font-size="17">Reiniciar → estado inicial da fase. Menu → interromper execução.</text><text x="20" y="305" font-size="17">Terceiro sucesso → fim da campanha → recomeçar ou menu.</text></g></svg>