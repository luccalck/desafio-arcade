<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410"><rect width="100%" height="100%" fill="#080f1a"/><g font-family="sans-serif" fill="#edf6ff"><text x="20" y="30" font-size="23">Estados e navegação da campanha</text><rect x="20" y="60" width="180" height="65" rx="8" fill="#122230" stroke="#64e8e4"/><text x="32" y="87" font-size="14">Menu / progresso</text><rect x="220" y="60" width="250" height="65" rx="8" fill="#122230" stroke="#64e8e4"/><text x="232" y="87" font-size="14">Treino guiado (opcional)</text><rect x="490" y="60" width="285" height="65" rx="8" fill="#122230" stroke="#64e8e4"/><text x="502" y="87" font-size="14">Briefing da missão liberada</text><text x="202" y="100" font-size="18">→</text><text x="472" y="100" font-size="18">→</text><rect x="20" y="175" width="220" height="65" rx="8" fill="#122230" stroke="#64e8e4"/><text x="32" y="202" font-size="14">Edição → execução / passo</text><rect x="270" y="175" width="230" height="65" rx="8" fill="#122230" stroke="#64e8e4"/><text x="282" y="202" font-size="14">Falha → editar novamente</text><rect x="530" y="175" width="245" height="65" rx="8" fill="#122230" stroke="#64e8e4"/><text x="542" y="202" font-size="14">Vitória → próxima / replay</text><text x="20" y="295" font-size="16">Menu/Parar interrompem execução. Nova tentativa reinicia dados e sinais.</text><text x="20" y="335" font-size="16">Vitória: 100 XP só uma vez + medalha. Missão 4 → fim da campanha.</text><text x="20" y="375" font-size="15">Reset confirmado → apaga apenas progresso do jogo. Treino não concede XP.</text></g></svg>