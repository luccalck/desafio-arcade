<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"><rect width="100%" height="100%" fill="#080f1a"/><g font-family="Arial,sans-serif" fill="#edf6ff"><text x="22" y="32" font-size="20">Wireframes de projeto - não são capturas de execução</text><rect x="20" y="66" width="240" height="270" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="33" y="93" font-size="15">MENU / CAMPANHA</text><text x="33" y="139" font-size="14">Novo / Continuar / Missões</text><text x="33" y="186" font-size="14">Opções / versão / XP</text><text x="33" y="233" font-size="14">Cinco setores e núcleo final</text><rect x="280" y="66" width="240" height="270" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="293" y="93" font-size="15">BANCADA / HUD</text><text x="293" y="139" font-size="14">Uma frase de objetivo</text><text x="293" y="186" font-size="14">Dados / encaixes / cabos</text><text x="293" y="233" font-size="14">Bandeja ou seleção contextual</text><text x="293" y="286" font-size="14">Ligar / pausa / ajuda / log</text><rect x="540" y="66" width="240" height="270" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="553" y="93" font-size="15">RESULTADO</text><text x="553" y="139" font-size="14">Lotes resolvidos / medalha</text><text x="553" y="186" font-size="14">Eficiência opcional / XP</text><text x="553" y="233" font-size="14">Repetir / próximo / missões</text><text x="22" y="399" font-size="12">Celular: bancada e controles empilhados; configuração, ajuda e registros sob demanda.</text></g></svg>