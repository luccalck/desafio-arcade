<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"><rect width="100%" height="100%" fill="#f4f0e6"/><g font-family="sans-serif" fill="#192b2b"><text x="20" y="30" font-size="19">Wireframes de projeto — não são capturas de execução</text><rect x="20" y="60" width="220" height="320" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="35" y="88" font-size="15">MENU</text><text x="35" y="135" font-size="13">Objetivo + instruções</text><text x="35" y="180" font-size="13">Robô / conceito original</text><text x="35" y="230" font-size="13">[Começar a jornada]</text><text x="35" y="285" font-size="13">Três desafios</text><text x="35" y="345" font-size="13">Versão / SHA</text><rect x="260" y="60" width="230" height="320" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="275" y="88" font-size="15">PARTIDA / HUD</text><rect x="275" y="110" width="95" height="135" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="290" y="138" font-size="15">Mapa</text><rect x="380" y="110" width="95" height="135" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="395" y="138" font-size="15">Editor</text><text x="275" y="280" font-size="12">Feedback + direção + passos</text><text x="275" y="320" font-size="12">[Executar] [Um passo]</text><text x="275" y="355" font-size="12">Dica / reinício</text><rect x="510" y="60" width="230" height="320" rx="6" fill="#fffdf7" stroke="#192b2b"/><text x="525" y="88" font-size="15">FIM DA TENTATIVA</text><text x="525" y="135" font-size="13">Mapa / posição final</text><text x="525" y="190" font-size="13">Resultado + conceito</text><text x="525" y="240" font-size="13">Registro da execução</text><text x="525" y="295" font-size="13">[Editar] [Próxima fase]</text><text x="525" y="350" font-size="13">[Menu] / [Reiniciar]</text><text x="20" y="430" font-size="12">No celular, mapa e editor são empilhados. Todas as ações têm controles HTML.</text></g></svg>