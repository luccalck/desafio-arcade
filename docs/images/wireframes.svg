<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440"><rect width="100%" height="100%" fill="#080f1a"/><g font-family="sans-serif" fill="#edf6ff"><text x="20" y="30" font-size="20">Wireframes de projeto - não são capturas de execução</text><rect x="20" y="60" width="240" height="310" rx="8" fill="#122230" stroke="#64e8e4"/><text x="32" y="87" font-size="14">CAMPANHA / MENU</text><text x="34" y="128" font-size="14">Jogar → treino guiado</text><text x="34" y="176" font-size="14">Quatro cartões de missão</text><text x="34" y="224" font-size="14">Bloqueio / replay / medalhas</text><text x="34" y="272" font-size="14">XP / versão / SHA</text><text x="34" y="330" font-size="14">Reset com confirmação</text><rect x="280" y="60" width="240" height="310" rx="8" fill="#122230" stroke="#64e8e4"/><text x="292" y="87" font-size="14">PARTIDA / HUD</text><text x="294" y="128" font-size="14">Objetivo / dados / A AND B</text><text x="294" y="176" font-size="14">Mapa / robô / trilha</text><text x="294" y="224" font-size="14">Blocos / edição / repetir</text><text x="294" y="272" font-size="14">Executar / passo / dica</text><text x="294" y="330" font-size="14">Feedback / direção / traço</text><rect x="540" y="60" width="240" height="310" rx="8" fill="#122230" stroke="#64e8e4"/><text x="552" y="87" font-size="14">FIM / RESULTADO</text><text x="554" y="128" font-size="14">Objetivos / posição final</text><text x="554" y="176" font-size="14">Causa / conceito aprendido</text><text x="554" y="224" font-size="14">Medalha + 100 XP uma vez</text><text x="554" y="272" font-size="14">Editar / próxima missão</text><text x="554" y="330" font-size="14">Campanha / replay</text><text x="20" y="415" font-size="12">Celular: painéis empilhados, barra de execução fixa e mapa revelado ao executar.</text></g></svg>