<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"><rect width="100%" height="100%" fill="#080f1a"/><g font-family="sans-serif" fill="#edf6ff"><text x="22" y="32" font-size="20">Wireframes de projeto - não são capturas de execução</text><rect x="20" y="66" width="240" height="270" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="33" y="93" font-size="15">MENU INICIAL / CAMPANHA</text><text x="33" y="139" font-size="14">Novo / Continuar / Missões</text><text x="33" y="186" font-size="14">Como jogar / Opções</text><text x="33" y="233" font-size="14">6 setores e desbloqueios</text><text x="33" y="286" font-size="14">Mascote / versão / XP</text><rect x="280" y="66" width="240" height="270" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="293" y="93" font-size="15">MISSÃO / HUD</text><text x="293" y="139" font-size="14">Aula → exemplo → prática</text><text x="293" y="186" font-size="14">Cenários / objetivo / estado</text><text x="293" y="233" font-size="14">Editor / SE / PARA CADA</text><text x="293" y="286" font-size="14">Pausa / teste / passo / dica</text><rect x="540" y="66" width="240" height="270" rx="9" fill="#122a3a" stroke="#64e8e4"/><text x="553" y="93" font-size="15">FIM / RESULTADO</text><text x="553" y="139" font-size="14">Casos resolvidos / falha</text><text x="553" y="186" font-size="14">Diagnóstico / registro</text><text x="553" y="233" font-size="14">Medalha / XP uma vez</text><text x="553" y="286" font-size="14">Editar / próximo / campanha</text><text x="22" y="398" font-size="12">Celular: simulador antes do editor; execução fixa; seletores de condições empilhados.</text></g></svg>