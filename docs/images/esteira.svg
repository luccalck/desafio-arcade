<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440"><rect width="100%" height="100%" fill="#080f1a"/><g font-family="sans-serif" fill="#edf6ff"><text x="20" y="30" font-size="21">Esteira - CI implementada; implantação e medições pendentes</text><rect x="20" y="60" width="230" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="32" y="87" font-size="14">Branch → PR / outra pessoa</text><rect x="280" y="60" width="220" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="292" y="87" font-size="14">CI: testes / segurança</text><rect x="530" y="60" width="245" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="542" y="87" font-size="14">Build único / PDF / hash</text><rect x="20" y="175" width="230" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="32" y="202" font-size="14">HML → regressão E2E</text><rect x="280" y="175" width="220" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="292" y="202" font-size="14">Aprovação em producao</text><rect x="530" y="175" width="245" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="542" y="202" font-size="14">Release → smoke / ponteiro</text><rect x="20" y="290" width="230" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="32" y="317" font-size="14">Rollback / sondas / Issues</text><rect x="280" y="290" width="220" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="292" y="317" font-size="14">Painel / DORA / melhoria</text><rect x="530" y="290" width="245" height="70" rx="8" fill="#122230" stroke="#64e8e4"/><text x="542" y="317" font-size="14">Triagem → pacote → AVA</text><text x="20" y="415" font-size="13">Azul-verde planejado: validar pasta imutável, promover ponteiro e recuperar se falhar.</text></g></svg>