name: Triagem Agendada
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Entrega aplica PRAZO; vigilância revalida o pacote sem aprovar o prazo'
        required: false
        default: vigilancia
        type: choice
        options: [vigilancia, entrega]
      alertar:
        description: 'Registrar alerta em caso de falha'
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: triagem-agendada
  cancel-in-progress: false
jobs:
  triagem-agendada:
    if: vars.TRIAGEM_AGENDADA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRAZO: ${{ vars.PRAZO }}
      EXPECTED_SHA: ${{ vars.SUBMISSION_SHA }}
      SUBMISSION_RUN_ID: ${{ vars.SUBMISSION_RUN_ID }}
      SUBMISSION_RUN_ATTEMPT: ${{ vars.SUBMISSION_RUN_ATTEMPT }}
      SUBMISSION_TAG: ${{ vars.SUBMISSION_TAG }}
      SUBMISSION_ARTIFACT_ID: ${{ vars.SUBMISSION_ARTIFACT_ID }}
      SUBMISSION_ARTIFACT_DIGEST: ${{ vars.SUBMISSION_ARTIFACT_DIGEST }}
      SITE_URL: ${{ vars.SITE_URL }}
      MODO: ${{ inputs.modo || 'vigilancia' }}
      ALERTAR: ${{ github.event_name == 'schedule' || inputs.alertar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.SUBMISSION_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Instalar dependências de triagem
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils ffmpeg
      - name: Recuperar pacote imutável exato e conferir proveniência remota
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$SUBMISSION_RUN_ID" =~ ^[0-9]+$ && "$SUBMISSION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$SUBMISSION_ARTIFACT_ID" =~ ^[0-9]+$ && "$SUBMISSION_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$SUBMISSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SUBMISSION_RUN_ID}" > reports/submissao-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SUBMISSION_ARTIFACT_ID}" > reports/submissao-artefato.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SUBMISSION_TAG}" > reports/submissao-tag.json
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const e=process.env,r=JSON.parse(await readFile('reports/submissao-run.json','utf8')),a=JSON.parse(await readFile('reports/submissao-artefato.json','utf8')),t=JSON.parse(await readFile('reports/submissao-tag.json','utf8'));
          if(r.path!=='.github/workflows/esteira.yml'||r.event!=='push'||r.head_branch!==e.SUBMISSION_TAG||r.head_sha!==e.EXPECTED_SHA||String(r.id)!==e.SUBMISSION_RUN_ID||String(r.run_attempt)!==e.SUBMISSION_RUN_ATTEMPT)throw Error('Run final não corresponde à origem fixada.');
          if(r.conclusion!=='success'){
            if(e.MODO!=='vigilancia'||r.conclusion!=='failure')throw Error('Entrega exige origem aprovada; vigilância não altera a conclusão original.');
            const jobs=JSON.parse(execFileSync('gh',['api',`repos/${e.GITHUB_REPOSITORY}/actions/runs/${r.id}/attempts/${e.SUBMISSION_RUN_ATTEMPT}/jobs?per_page=100`],{encoding:'utf8'})).jobs;
            const gates=['ci','pacote-ci','deploy-hml','deploy-prd','monitor-pos-producao','release'];
            if(gates.some(name=>!jobs.some(j=>j.name===name&&j.conclusion==='success')))throw Error('Gates de publicação da origem não foram concluídos.');
            const submission=jobs.find(j=>j.name==='submissao');
            const failures=jobs.filter(j=>j.conclusion==='failure');
            const failedSteps=submission?.steps?.filter(s=>s.conclusion==='failure')??[];
            if(failures.length!==1||failures[0].name!=='submissao'||failedSteps.length!==1||failedSteps[0].name!=='Executar e arquivar triagem formal na tag final'||!submission.steps.some(s=>s.name==='Gerar submissão só dos bytes homologados, publicados e verificados'&&s.conclusion==='success'))throw Error('Origem falhou fora da triagem de entrega.');
            console.warn('VIGILÂNCIA TÉCNICA: origem mantém triagem de entrega reprovada; pacote será revalidado sem aprovar prazo ou submissão.');
          }
          if(a.expired||a.workflow_run?.id!==r.id||a.workflow_run?.head_sha!==e.EXPECTED_SHA||a.name!==`submissao-${e.EXPECTED_SHA}-${e.SUBMISSION_RUN_ID}-${e.SUBMISSION_RUN_ATTEMPT}`||a.digest!==e.SUBMISSION_ARTIFACT_DIGEST)throw Error('Artefato expirado, digest ou origem divergente.');
          if(t.object?.type!=='tag')throw Error('Tag final deve ser anotada.');
          const tag=JSON.parse(execFileSync('gh',['api',`repos/${e.GITHUB_REPOSITORY}/git/tags/${t.object.sha}`],{encoding:'utf8'}));
          if(tag.object.type!=='commit'||tag.object.sha!==e.EXPECTED_SHA)throw Error('Tag final aponta a outro SHA.');
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SUBMISSION_ARTIFACT_ID}/zip" > pacote-submissao.zip
          node --input-type=module <<'NODE'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {unzipSync} from 'fflate';
          const bytes=await readFile('pacote-submissao.zip');
          if('sha256:'+createHash('sha256').update(bytes).digest('hex')!==process.env.SUBMISSION_ARTIFACT_DIGEST)throw Error('SHA-256 do arquivo remoto divergente.');
          const expected=['GDD.pdf','LINK_DO_JOGO.txt','build.zip','pitch.mp4','MANIFESTO.sha256','submissao-manifest.json'];
          const files=unzipSync(bytes,{filter:f=>{if(!expected.includes(f.name))throw Error('Arquivo inesperado no artefato.');return true;}});
          if(expected.some(n=>!files[n])||Object.keys(files).length!==expected.length)throw Error('Submissão incompleta.');
          await mkdir('submissao');for(const [name,data] of Object.entries(files))await writeFile(`submissao/${name}`,data);
          NODE
      - name: Revalidar o pacote real completo, hashes, PDF, vídeo e smoke público
        shell: bash
        run: |
          set -o pipefail
          node scripts/submissao.mjs verify submissao
          node scripts/triagem.mjs submissao --modo="$MODO" | tee reports/triagem-agendada.log
      - name: Notificar falha real de recuperação ou validação
        if: failure() && (github.event_name == 'schedule' || inputs.alertar)
        run: |
          node --input-type=module -e "import {notifyAlert} from './scripts/triagem.mjs';await notifyAlert({kind:'TriagemIndisponivel',url:process.env.SITE_URL,reason:'Falha na recuperação ou revalidação do pacote final imutável. Consultar a execução Actions '+process.env.GITHUB_RUN_ID});"
      - name: Documentar horário real e fonte agendada
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '{id,event,created_at,run_started_at,head_sha}' > reports/triagem-agendada-run.json
          node --input-type=module <<'NODE'
          import {writeFile,readFile} from 'node:fs/promises';
          const run=JSON.parse(await readFile('reports/triagem-agendada-run.json','utf8'));
          const report={...run,observedAt:new Date().toISOString(),cron:'0 12 * * *',submissionRun:process.env.SUBMISSION_RUN_ID,submissionArtifact:process.env.SUBMISSION_ARTIFACT_ID,delayNote:'created_at e run_started_at são horários reais da API; não representam o instante prometido pelo scheduler. Compare a janela nominal de 12:00 UTC com a data desta execução.'};
          await writeFile('reports/triagem-agendada-execucao.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: triagem-agendada-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
