name: Esteira
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**', 'chore/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  PLAYWRIGHT_CHANNEL: chrome
jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run content:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualidade-${{ github.sha }}
          path: reports/
          if-no-files-found: error
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Gitleaks CLI verificado
        shell: bash
        run: |
          mkdir -p reports "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --config .gitleaks.toml --report-format json --report-path reports/gitleaks.json
      - name: Audit bloqueia vulnerabilidade crítica de produção
        run: npm audit --omit=dev --audit-level=critical --json > reports/npm-audit.json
      - name: SBOM CycloneDX
        run: npm sbom --sbom-format cyclonedx > reports/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: seguranca-${{ github.sha }}
          path: reports/
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run reproducibility
      - run: npm run gdd:pdf
      - name: Verificação do PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          mkdir -p reports
          pdfinfo artifacts/GDD.pdf | tee reports/pdfinfo.txt
          pdftotext artifacts/GDD.pdf reports/gdd-texto.txt
          test -s reports/gdd-texto.txt
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-${{ github.sha }}
          path: |
            artifacts/build.zip
            artifacts/build.zip.sha256
            artifacts/GDD.pdf
            dist/version.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: construcao-${{ github.sha }}
          path: reports/
          if-no-files-found: error
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: e2e-${{ github.sha }}
          path: |
            reports/
            test-results/
          if-no-files-found: error
  ci:
    runs-on: ubuntu-latest
    needs: [qualidade, seguranca, build, e2e]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Aceite agregado obrigatório
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS);for(const [job,value] of Object.entries(n)){console.log(job,value.result);if(value.result!=="success")process.exitCode=1;}'
  publicar-preview:
    needs: [ci, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/primeiro-ciclo' && vars.PAGES_PREVIEW_ENABLED == 'true' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-preview
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: build-${{ github.sha }}
          path: artifacts-ci
      - name: Recuperar árvore publicada
        shell: bash
        run: |
          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote "$repo_url" refs/heads/gh-pages | grep -q refs/heads/gh-pages; then
            git clone --branch gh-pages --single-branch "$repo_url" pages-tree
          else
            git init -b gh-pages pages-tree
            git -C pages-tree remote add origin "$repo_url"
          fi
      - name: Conferir ZIP e preservar releases imutáveis
        run: node scripts/prepare-pages.mjs --zip artifacts-ci/artifacts/build.zip --checksum artifacts-ci/artifacts/build.zip.sha256 --sha "$GITHUB_SHA" --existing pages-tree --output pages-site
      - name: Atualizar gh-pages somente pela pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp -a pages-site/. pages-tree/
          git -C pages-tree config user.name 'github-actions[bot]'
          git -C pages-tree config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C pages-tree add .
          if ! git -C pages-tree diff --cached --quiet; then
            git -C pages-tree commit -m "deploy: preview ${GITHUB_SHA}"
            git -C pages-tree -c 'credential.helper=!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin gh-pages
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages-site
      - name: Publicar o mesmo artefato no Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Regressão HML e smoke do preview público
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: npx playwright test --config playwright.public.config.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: preview-${{ github.sha }}
          path: |
            reports/pages-smoke.xml
            reports/screens/pages-*.png
            test-results/
          if-no-files-found: warn
# Preview expressamente solicitado em12/10/2026. Não substitui revisão de outro autor,
# aprovação em producao, rollout/rollback medidos ou aceites finais G0–G8.
