name: Publicar árvore Pages preservada
description: Publica uma árvore já preparada sem recompilar o jogo.
inputs:
  path:
    description: Diretório preparado
    required: true
  name:
    description: Nome único do artefato desta fase
    required: true
runs:
  using: composite
  steps:
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        include-hidden-files: true
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      with:
        artifact_name: ${{ inputs.name }}
        timeout: '180000'
